<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLO Preschool â Admission Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #07ABEE;
    --blue-deep: #058bc4;
    --orange: #FAA619;
    --orange-deep: #e0910a;
    --cream: #FFF9F0;
    --card: #EAF7FE;
    --ink: #1B3A4B;
    --ink-soft: #5C7A8A;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Nunito Sans', sans-serif;
    background: transparent;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    min-height: 100vh;
    padding: 24px;
  }

  /* ââ Launcher âââââââââââââââââââââââââââââââââââââââââââ */
  .launcher {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--blue-deep));
    box-shadow: 0 8px 24px rgba(7, 171, 238, 0.35);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    position: relative;
  }
  .launcher:hover { transform: scale(1.06); }
  .launcher svg { width: 30px; height: 30px; }
  .launcher .dot {
    position: absolute;
    top: 4px; right: 4px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--orange);
    border: 2px solid var(--cream);
  }

  /* ââ Panel ââââââââââââââââââââââââââââââââââââââââââââââ */
  .panel {
    display: none;
    width: 360px;
    max-width: calc(100vw - 48px);
    height: 560px;
    max-height: calc(100vh - 48px);
    background: var(--cream);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(27, 58, 75, 0.25);
    overflow: hidden;
    flex-direction: column;
    position: absolute;
    bottom: 24px;
    right: 24px;
  }
  .panel.open { display: flex; }

  .header {
    background: linear-gradient(120deg, var(--blue) 0%, var(--blue-deep) 100%);
    padding: 20px 20px 24px;
    color: white;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 20px;
    background: var(--cream);
    border-radius: 20px 20px 0 0;
  }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .school-name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 19px;
    margin: 0;
  }
  .school-sub {
    font-size: 12.5px;
    opacity: 0.9;
    margin: 4px 0 0;
  }
  .close-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }

  .body-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .intake-card {
    background: var(--white);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .intake-card p {
    margin: 0 0 2px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .intake-card input {
    border: 1.5px solid #D9ECF5;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    outline: none;
  }
  .intake-card input:focus { border-color: var(--blue); }
  .intake-start {
    background: var(--orange);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-weight: 700;
    font-family: 'Nunito Sans', sans-serif;
    cursor: pointer;
    font-size: 14px;
  }
  .intake-start:hover { background: var(--orange-deep); }
  .intake-skip {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
  }
  .bubble.agent {
    background: var(--card);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    background: var(--blue);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .footer {
    padding: 14px 18px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .mic-wrap {
    position: relative;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mic-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--blue);
    opacity: 0;
  }
  .mic-wrap.listening .mic-ring {
    animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  .mic-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--blue), var(--blue-deep));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(7,171,238,0.35);
    transition: background 0.2s ease;
  }
  .mic-wrap.listening .mic-btn { background: linear-gradient(135deg, var(--orange), var(--orange-deep)); }
  .mic-btn svg { width: 22px; height: 22px; }
  .status-text { font-size: 12px; color: var(--ink-soft); min-height: 16px; }

  .type-row {
    display: flex;
    gap: 8px;
    width: 100%;
    padding: 0 4px;
  }
  .type-row input {
    flex: 1;
    border: 1.5px solid #D9ECF5;
    border-radius: 20px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
  }
  .type-row input:focus { border-color: var(--blue); }
  .type-row button {
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 16px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }

  .fallback-note {
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    padding: 0 12px;
  }
</style>
</head>
<body>

<button class="launcher" id="launcherBtn" aria-label="Open admission assistant">
  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="23"/>
    <line x1="8" y1="23" x2="16" y2="23"/>
  </svg>
  <span class="dot"></span>
</button>

<div class="panel" id="panel">
  <div class="header">
    <div class="header-top">
      <div>
        <p class="school-name">GLO Preschool</p>
        <p class="school-sub">Admission Assistant Â· ask me anything</p>
      </div>
      <button class="close-btn" id="closeBtn">â</button>
    </div>
  </div>

  <div class="body-scroll" id="scrollArea">
    <div class="intake-card" id="intakeCard">
      <p>So we can call you back if needed â your name &amp; number (optional):</p>
      <input type="text" id="parentName" placeholder="Parent's name">
      <input type="tel" id="parentPhone" placeholder="Phone number">
      <button class="intake-start" id="intakeStart">Start asking</button>
      <button class="intake-skip" id="intakeSkip">Skip and just ask a question</button>
    </div>
  </div>

  <div class="footer">
    <div class="mic-wrap" id="micWrap">
      <div class="mic-ring"></div>
      <button class="mic-btn" id="micBtn" aria-label="Hold to speak">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-3.06A9 9 0 0 0 21 11h-2z"/>
        </svg>
      </button>
    </div>
    <p class="status-text" id="statusText">Tap the mic and ask a question</p>
    <div class="type-row">
      <input type="text" id="typeInput" placeholder="...or type your question">
      <button id="typeSend">Send</button>
    </div>
    <p class="fallback-note" id="fallbackNote"></p>
  </div>
</div>

<script>
  // ââ CONFIG â paste your deployed Apps Script Web App URL here ââââââââââââââ
  const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxY-VlkWZqhKDo9lKtPaS09Py05JoyIHVn2wFF9CioXAsM1nb14DTgin6zmSQXL2fXTqg/exec";

  const launcherBtn = document.getElementById('launcherBtn');
  const panel = document.getElementById('panel');
  const closeBtn = document.getElementById('closeBtn');
  const scrollArea = document.getElementById('scrollArea');
  const intakeCard = document.getElementById('intakeCard');
  const intakeStart = document.getElementById('intakeStart');
  const intakeSkip = document.getElementById('intakeSkip');
  const parentNameInput = document.getElementById('parentName');
  const parentPhoneInput = document.getElementById('parentPhone');
  const micWrap = document.getElementById('micWrap');
  const micBtn = document.getElementById('micBtn');
  const statusText = document.getElementById('statusText');
  const typeInput = document.getElementById('typeInput');
  const typeSend = document.getElementById('typeSend');
  const fallbackNote = document.getElementById('fallbackNote');

  let parentName = '';
  let parentPhone = '';

  launcherBtn.addEventListener('click', () => panel.classList.add('open'));
  closeBtn.addEventListener('click', () => panel.classList.remove('open'));

  function beginChat() {
    parentName = parentNameInput.value.trim();
    parentPhone = parentPhoneInput.value.trim();
    intakeCard.remove();
    addBubble("Hi! I'm the GLO Preschool admission assistant. Ask me about fees, age criteria, documents, timings, or anything else â by voice or typing.", 'agent');
  }
  intakeStart.addEventListener('click', beginChat);
  intakeSkip.addEventListener('click', beginChat);

  function addBubble(text, who) {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + who;
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    b.textContent = text;
    row.appendChild(b);
    scrollArea.appendChild(row);
    scrollArea.scrollTop = scrollArea.scrollHeight;
  }

  async function askAgent(question) {
    addBubble(question, 'user');
    statusText.textContent = 'Thinking...';

    if (WEBHOOK_URL.indexOf('PASTE_YOUR') === 0) {
      addBubble("(Setup needed: paste your Apps Script Web App URL into WEBHOOK_URL in this file.)", 'agent');
      statusText.textContent = 'Tap the mic and ask a question';
      return;
    }

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
        body: JSON.stringify({ question, name: parentName, phone: parentPhone })
      });
      const data = await res.json();
      addBubble(data.answer, 'agent');
      speak(data.answer);
    } catch (err) {
      addBubble("Sorry, I couldn't reach the server. Please try again in a moment.", 'agent');
    }
    statusText.textContent = 'Tap the mic and ask a question';
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.98;
    speechSynthesis.speak(utter);
  }

  // ââ typed input ââââââââââââââââââââââââââââââââââââââââââ
  typeSend.addEventListener('click', () => {
    const q = typeInput.value.trim();
    if (!q) return;
    typeInput.value = '';
    askAgent(q);
  });
  typeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') typeSend.click();
  });

  // ââ voice input (Web Speech API â Chrome/Edge/Safari support varies) âââââââ
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;

  if (!SpeechRecognition) {
    fallbackNote.textContent = "Voice input isn't supported in this browser â please type your question instead.";
    micBtn.disabled = true;
    micBtn.style.opacity = 0.4;
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-IN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognizing = true;
      micWrap.classList.add('listening');
      statusText.textContent = 'Listening...';
    };
    recognition.onend = () => {
      recognizing = false;
      micWrap.classList.remove('listening');
    };
    recognition.onerror = () => {
      statusText.textContent = 'Tap the mic and ask a question';
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      askAgent(transcript);
    };

    micBtn.addEventListener('click', () => {
      if (recognizing) { recognition.stop(); return; }
      recognition.start();
    });
  }
</script>

</body>
</html>
